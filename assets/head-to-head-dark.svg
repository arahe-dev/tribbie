<svg xmlns="http://www.w3.org/2000/svg" width="640" height="216" viewBox="0 0 640 216" role="img" aria-labelledby="h2hd-title h2hd-desc">
  <title id="h2hd-title">Head-to-head result</title>
  <desc id="h2hd-desc">Claude Opus alone picked the object in 0 of 6 trials; Claude Opus with the 16-D latent skill picked it in 4 of 6, in about 18 seconds.</desc>
  <defs><marker id="h2hd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa4b2"/></marker></defs>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="24" y="34" text-anchor="start" font-size="14" font-weight="650" fill="#f0f3f6">Pick up the commanded object  ·  success read from PhysX</text>
    <text x="24" y="84" text-anchor="start" font-size="15" font-weight="650" fill="#f0f3f6">Claude Opus alone</text>
    <rect x="260" y="64" width="300" height="30" rx="6" fill="#f0f3f6" fill-opacity="0.05" stroke="#f0f3f6" stroke-width="1.2"/>
    <text x="574" y="85" text-anchor="start" font-size="18" font-weight="700" fill="#f0f3f6">0/6</text>
    <text x="260" y="114" text-anchor="start" font-size="12" font-weight="400" fill="#9aa4b2">never succeeded · 13.0 Opus calls per attempt</text>
    <text x="24" y="162" text-anchor="start" font-size="15" font-weight="650" fill="#f0f3f6">Claude Opus + 16-D skill</text>
    <rect x="260" y="142" width="300" height="30" rx="6" fill="#f0f3f6" fill-opacity="0.05" stroke="#f0f3f6" stroke-width="1.2"/>
    <rect x="260" y="142" width="200.0" height="30" rx="6" fill="#f0f3f6"/>
    <text x="574" y="163" text-anchor="start" font-size="18" font-weight="700" fill="#f0f3f6">4/6</text>
    <text x="260" y="192" text-anchor="start" font-size="12" font-weight="400" fill="#9aa4b2">mean 18 s when successful · 2.2 Opus calls per attempt</text>
  </g>
</svg>
